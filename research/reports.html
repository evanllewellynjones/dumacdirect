<script>
let VIEW="company";
function banner(t,ok){ const b=$("#banner"); b.textContent=t||"";
  b.className="banner"+(t?" show":"")+(ok?" ok":""); }

/* ---------- selectors over the corpus ---------- */
const companies = ns => ns.filter(n=>n.record_type==="Company"
                                 || (n.record_type==null && n.ticker));
const themes    = ns => ns.filter(n=>n.record_type==="Theme"
                                 || (n.record_type==null && !n.ticker));

/* Themes that reference a ticker in tickers[] — the reverse index. */
function themesForTicker(ns,tk){
  const seen=new Map();
  for(const n of themes(ns)){
    const list=Array.isArray(n.tickers)?n.tickers:[];
    if(list.includes(tk)){
      if(!seen.has(n.entity)) seen.set(n.entity,[]);
      seen.get(n.entity).push(n);
    }
  }
  return seen;
}

/* Current price target per contributor.
   Blank = "this note did not address the target", NOT a reset.
   Buy and sell carry forward independently.
   Contributors with no target at all are omitted entirely. */
function targetGrid(recs){
  const by=new Map();
  const asc=[...recs].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const n of asc){
    const who=n.contributor||"unknown";
    if(!by.has(who)) by.set(who,{who,buy:null,buyDate:null,sell:null,sellDate:null,conv:null,convDate:null});
    const r=by.get(who);
    if(n.price_target_buy!==null&&n.price_target_buy!==undefined&&n.price_target_buy!==""){
      r.buy=n.price_target_buy; r.buyDate=n.date; }
    if(n.price_target_sell!==null&&n.price_target_sell!==undefined&&n.price_target_sell!==""){
      r.sell=n.price_target_sell; r.sellDate=n.date; }
    if(n.conviction){ r.conv=n.conviction; r.convDate=n.date; }
  }
  return [...by.values()].filter(r=>r.buy!==null||r.sell!==null);
}
function convGrid(recs){
  const by=new Map();
  const asc=[...recs].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const n of asc){
    if(!n.conviction) continue;
    by.set(n.contributor||"unknown",{who:n.contributor||"unknown",
      conv:n.conviction,date:n.date});
  }
  return [...by.values()];
}

/* ---------- rendering helpers ---------- */
function noteRow(n){
  const d=el("div","noterow");
  const hd=el("div","hd");
  const s=el("span","subj",n.subject||"(no subject)");
  s.onclick=()=>openReader(n);
  hd.appendChild(s);
  if(n.review_date){
    const days=ageDays(n.review_date);
    const cls = n.review_status==="Done" ? "pill done"
              : (days!==null&&days>=0) ? "pill overdue" : "pill due";
    hd.appendChild(el("span",cls,"review "+fmtDate(n.review_date)));
  }
  hd.appendChild(el("span","meta",fmtDate(n.date)+" \u00b7 "+(n.contributor||"")));
  d.appendChild(hd);
  if(Array.isArray(n.tags)&&n.tags.length){
    const t=el("div","meta",n.tags.join(" \u00b7 "));
    t.style.marginTop="2px"; d.appendChild(t);
  }
  if(n._body) d.appendChild(el("div","body",n._body.replace(/[#*`>]/g,"").slice(0,220)));
  return d;
}
function section(title){
  const c=el("div","card");
  c.appendChild(el("div","sect",title));
  return c;
}
function emptyLine(t){ return el("div","empty",t); }

function openReader(n){
  $("#rd_title").textContent=n.subject||"(no subject)";
  $("#rd_meta").textContent=
    [n.note_id, n.record_type||"unclassified", n.contributor, fmtDate(n.date),
     n.ticker?("ticker "+n.ticker):"", (n.tags||[]).join(", ")]
    .filter(Boolean).join("  \u00b7  ");
  $("#rd_body").textContent=n._body||"(empty)";
  $("#reader").classList.add("show");
}
$("#rd_close").onclick=()=>$("#reader").classList.remove("show");
$("#reader").onclick=e=>{ if(e.target.id==="reader") $("#reader").classList.remove("show"); };

/* ---------- COMPANY VIEW ---------- */
async function renderCompany(){
  const out=$("#company_out"); out.innerHTML="";
  const tk=$("#q_ticker").value.trim().toUpperCase();
  const ns=await walkNotes();
  if(!tk){ out.appendChild(emptyLine("Enter a ticker above.")); return; }

  const own=companies(ns).filter(n=>n.ticker===tk);
  const themeMap=themesForTicker(ns,tk);

  if(!own.length && !themeMap.size){
    out.appendChild(emptyLine("No records for "+tk+".")); return; }

  const name=(own.find(n=>n.entity)||{}).entity||tk;
  const isPrivate=tk.startsWith("P.");
  const listed=own.length ? own[own.length-1].listed : null;

  // header
  const h=section(name+"  \u00b7  "+tk);
  const meta=el("div","tiny");
  meta.textContent=own.length+" record(s)"
    + (isPrivate||listed===false||listed==="false" ? "  \u00b7  private \u2014 no price data" : "")
    + (themeMap.size ? "  \u00b7  "+themeMap.size+" theme(s)" : "");
  h.appendChild(meta);
  out.appendChild(h);

  // price targets — only contributors who have one
  const grid=targetGrid(own);
  if(grid.length){
    const c=section("Price targets");
    const t=el("table","grid");
    t.innerHTML="<thead><tr><th>Contributor</th><th>Buy</th><th>As of</th>"
               +"<th>Sell</th><th>As of</th></tr></thead>";
    const tb=el("tbody");
    for(const r of grid){
      const tr=el("tr");
      tr.appendChild(el("td","",r.who));
      const bd=ageDays(r.buyDate), sd=ageDays(r.sellDate);
      const cb=el("td","num",r.buy===null?"\u2014":String(r.buy));
      if(bd!==null&&bd>180) cb.classList.add("stale");
      tr.appendChild(cb);
      tr.appendChild(el("td","tiny",r.buyDate?fmtDate(r.buyDate)+"  ("+ageLabel(r.buyDate)+")":""));
      const cs=el("td","num",r.sell===null?"\u2014":String(r.sell));
      if(sd!==null&&sd>180) cs.classList.add("stale");
      tr.appendChild(cs);
      tr.appendChild(el("td","tiny",r.sellDate?fmtDate(r.sellDate)+"  ("+ageLabel(r.sellDate)+")":""));
      tb.appendChild(tr);
    }
    t.appendChild(tb); c.appendChild(t);
    c.appendChild(el("div","tiny","Greyed values are more than six months old."));
    out.appendChild(c);
  }

  // conviction — same sparse rule
  const cg=convGrid(own);
  if(cg.length){
    const c=section("Conviction");
    const t=el("table","grid");
    t.innerHTML="<thead><tr><th>Contributor</th><th>Conviction</th><th>As of</th></tr></thead>";
    const tb=el("tbody");
    for(const r of cg){
      const tr=el("tr");
      tr.appendChild(el("td","",r.who));
      tr.appendChild(el("td","",r.conv));
      tr.appendChild(el("td","tiny",fmtDate(r.date)+"  ("+ageLabel(r.date)+")"));
      tb.appendChild(tr);
    }
    t.appendChild(tb); c.appendChild(t); out.appendChild(c);
  }

  // themes — names and links only, not the theme notes
  if(themeMap.size){
    const c=section("Themes");
    for(const [theme,recs] of themeMap){
      const d=el("div","noterow");
      const a=el("span","linkish",theme);
      a.onclick=()=>{ setView("theme"); $("#q_theme").value=theme; renderTheme(); };
      d.appendChild(a);
      d.appendChild(el("span","meta","   "+recs.length+" theme note(s)"));
      c.appendChild(d);
    }
    out.appendChild(c);
  }

  // reviews on this name
  const due=own.filter(n=>n.review_date && n.review_status!=="Done");
  if(due.length){
    const c=section("Reviews due");
    due.sort((a,b)=>String(a.review_date).localeCompare(String(b.review_date)));
    due.forEach(n=>c.appendChild(noteRow(n)));
    out.appendChild(c);
  }

  // notes
  const c=section("Notes ("+own.length+")");
  if(!own.length) c.appendChild(emptyLine("No company records \u2014 this ticker appears only in theme records."));
  own.forEach(n=>c.appendChild(noteRow(n)));
  out.appendChild(c);
}

/* ---------- THEME VIEW ---------- */
async function renderTheme(){
  const out=$("#theme_out"); out.innerHTML="";
  const th=$("#q_theme").value;
  const ns=await walkNotes();
  if(!th){ out.appendChild(emptyLine("Pick a theme above.")); return; }

  const recs=themes(ns).filter(n=>n.entity===th);
  if(!recs.length){ out.appendChild(emptyLine("No records for "+th+".")); return; }

  const h=section(th);
  h.appendChild(el("div","tiny",recs.length+" record(s)"));
  out.appendChild(h);

  // catalysts = anything with a review date
  const cat=recs.filter(n=>n.review_date);
  if(cat.length){
    const c=section("Catalysts \u2014 dated reviews");
    cat.sort((a,b)=>String(a.review_date).localeCompare(String(b.review_date)));
    cat.forEach(n=>c.appendChild(noteRow(n)));
    out.appendChild(c);
  }

  // members: union of tickers[] across the theme's records
  const union=new Map();
  for(const n of recs) for(const t of (Array.isArray(n.tickers)?n.tickers:[]))
    union.set(t,(union.get(t)||0)+1);
  if(union.size){
    const c=section("Associated tickers ("+union.size+")");
    const byName=new Map();
    for(const n of companies(ns)) if(n.ticker&&n.entity) byName.set(n.ticker,n.entity);
    const wrapd=el("div","chips");
    [...union.keys()].sort().forEach(t=>{
      const e=el("span","chip"); e.dataset.src="tkr";
      const b=el("b","",t); e.appendChild(b);
      const nm=byName.get(t);
      if(nm) e.appendChild(el("span","tiny"," "+nm));
      e.style.cursor="pointer";
      e.onclick=()=>{ setView("company"); $("#q_ticker").value=t; renderCompany(); };
      wrapd.appendChild(e);
    });
    c.appendChild(wrapd);
    c.appendChild(el("div","tiny","Click a ticker to open its company page. "
      + "P. prefix marks a private company."));
    out.appendChild(c);
  }

  const c=section("Notes ("+recs.length+")");
  recs.forEach(n=>c.appendChild(noteRow(n)));
  out.appendChild(c);
}

/* ---------- REVIEW QUEUE ---------- */
/* ---------- REVIEW QUEUE ----------
   Company and Theme records both carry an optional review_date. Blank means
   unscheduled, and unscheduled records are hidden unless you ask for them.
   review_date and review_status are shared curation fields — anyone can move
   a date, the same way anyone can set priority. Last write wins. */
function reviewRows(){
  const ns=RC.notes||[];
  const from=$("#q_rvfrom").value, to=$("#q_rvto").value;
  const st=$("#q_revstatus").value, ty=$("#q_rvtype").value;
  const th=$("#q_rvtheme").value, tk=$("#q_rvtkr").value;
  const wh=$("#q_revwho").value, incNone=$("#q_rvnone").checked;

  return ns.filter(n=>{
    const has=!!n.review_date;
    if(!has && !incNone) return false;
    if(has){
      if(from && n.review_date<from) return false;
      if(to   && n.review_date>to)   return false;
      if(st==="open" && n.review_status==="Done") return false;
      if(st==="done" && n.review_status!=="Done") return false;
    }else if(st==="done") return false;      // unscheduled is never Done
    if(ty && n.record_type!==ty) return false;
    if(th && !(n.record_type==="Theme" && n.entity===th)) return false;
    if(tk){
      const own = n.ticker===tk;
      const linked = Array.isArray(n.tickers) && n.tickers.includes(tk);
      if(!own && !linked) return false;
    }
    if(wh && n.contributor!==wh) return false;
    return true;
  }).sort((a,b)=>{
    // scheduled first, by date; unscheduled last, by entry date
    if(!!a.review_date !== !!b.review_date) return a.review_date?-1:1;
    if(a.review_date) return String(a.review_date).localeCompare(String(b.review_date));
    return String(b.date).localeCompare(String(a.date));
  });
}

async function renderReview(){
  const out=$("#review_out"); out.innerHTML="";
  const rows=reviewRows();
  const today=new Date().toISOString().slice(0,10);
  $("#rvcount").textContent=rows.length+" record(s)";

  if(!rows.length){ out.appendChild(el("div","card")).appendChild(
    el("div","empty","Nothing matches. Widen the date range, or tick "
      + "\u201calso show records with no review date\u201d.")); return; }

  const groups=[
    ["Overdue",   rows.filter(n=>n.review_date && n.review_date< today && n.review_status!=="Done")],
    ["Due today", rows.filter(n=>n.review_date===today && n.review_status!=="Done")],
    ["Upcoming",  rows.filter(n=>n.review_date && n.review_date> today && n.review_status!=="Done")],
    ["Done",      rows.filter(n=>n.review_date && n.review_status==="Done")],
    ["Unscheduled", rows.filter(n=>!n.review_date)]
  ];
  for(const [label,set] of groups){
    if(!set.length) continue;
    const c=el("div","card");
    c.appendChild(el("div","sect",label+" ("+set.length+")"));
    const t=el("table","grid rvtbl");
    t.innerHTML="<thead><tr><th style='width:132px'>Review date</th>"
               +"<th>Note</th><th style='width:150px'>Entered</th></tr></thead>";
    const tb=el("tbody");
    set.forEach(n=>tb.appendChild(reviewRow(n,today)));
    t.appendChild(tb); c.appendChild(t); out.appendChild(c);
  }
}

function reviewRow(n,today){
  const tr=el("tr");

  /* --- LEFT: the review date, editable in place --- */
  const l=el("td","rvdate");
  const inp=el("input"); inp.type="date"; inp.value=n.review_date||"";
  inp.title="Change the review date, or clear it to unschedule.";
  l.appendChild(inp);
  if(n.review_date){
    const overdue=n.review_date<today && n.review_status!=="Done";
    const cls=n.review_status==="Done"?"pill done":(overdue?"pill overdue":"pill due");
    const p=el("span",cls,n.review_status==="Done"?"Done"
             :(overdue?"overdue "+Math.abs(ageDays(n.review_date))+"d":ageLabel(n.review_date)+" out"));
    p.style.marginTop="4px"; p.style.display="inline-block";
    l.appendChild(p);
  }
  const save=el("button","btn","Save date");
  save.style.cssText="margin-top:5px;padding:3px 8px;font-size:12px";
  save.disabled=true;
  inp.onchange=()=>{ save.disabled = inp.value===(n.review_date||""); };
  save.onclick=async()=>{
    save.disabled=true;
    const v=inp.value||"";
    try{
      await rewriteNote(n,txt=>{
        txt=setFMLine(txt,"review_date",v);
        return setFMLine(txt,"review_status",v?(n.review_status||"Pending"):"");
      });
      n.review_date=v||null;
      n.review_status=v?(n.review_status||"Pending"):null;
      renderReview();
    }catch(e){ alert("Could not save: "+e.message); save.disabled=false; }
  };
  l.appendChild(save);
  tr.appendChild(l);

  /* --- MIDDLE: the note --- */
  const m=el("td");
  const subj=el("div","subj",n.subject||"(no subject)");
  subj.onclick=()=>openReader(n);
  m.appendChild(subj);
  const tgt = n.ticker || (Array.isArray(n.tickers)&&n.tickers.length
              ? n.tickers.join(" ") : "");
  const meta=el("div","meta");
  meta.textContent=[n.record_type||"unclassified",n.entity,tgt].filter(Boolean).join("  \u00b7  ");
  m.appendChild(meta);
  if(Array.isArray(n.tags)&&n.tags.length)
    m.appendChild(el("div","meta",n.tags.join(" \u00b7 ")));
  if(n._body) m.appendChild(el("div","body",excerpt(n._body)));
  tr.appendChild(m);

  /* --- RIGHT: entry date, contributor, status toggle --- */
  const r=el("td","rvmeta");
  r.appendChild(el("div","",fmtDate(n.date)));
  r.appendChild(el("div","tiny",n.contributor||""));
  if(n.review_date){
    const btn=el("button","btn",n.review_status==="Done"?"Reopen":"Mark done");
    btn.style.cssText="margin-top:5px;padding:3px 8px;font-size:12px";
    btn.onclick=async()=>{
      btn.disabled=true;
      const next=n.review_status==="Done"?"Pending":"Done";
      try{
        await rewriteNote(n,txt=>setFMLine(txt,"review_status",next));
        n.review_status=next; renderReview();
      }catch(e){ alert("Could not update: "+e.message); btn.disabled=false; }
    };
    r.appendChild(btn);
  }
  tr.appendChild(r);
  return tr;
}

/* Strip markdown noise so the excerpt reads as prose, not as source. */
function excerpt(b){
  return String(b)
    .replace(/^#{1,6}\s+/gm,"")
    .replace(/^[-*+]\s+/gm,"")
    .replace(/^>\s*/gm,"")
    .replace(/\*\*([^*]+)\*\*/g,"$1")
    .replace(/\*([^*]+)\*/g,"$1")
    .replace(/`([^`]+)`/g,"$1")
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g,"$1")
    .replace(/\s+/g," ").trim().slice(0,240);
}

/* ---------- SEARCH ---------- */
async function renderSearch(){
  const out=$("#search_out"); out.innerHTML="";
  const ns=await walkNotes();
  const q=$("#q_text").value.trim().toLowerCase();
  const tag=$("#q_tag").value, who=$("#q_who").value;
  let rows=ns;
  if(q) rows=rows.filter(n=>((n.subject||"")+" "+(n._body||"")).toLowerCase().includes(q));
  if(tag) rows=rows.filter(n=>Array.isArray(n.tags)&&n.tags.includes(tag));
  if(who) rows=rows.filter(n=>n.contributor===who);
  const c=section(rows.length+" record(s)");
  if(!rows.length) c.appendChild(emptyLine("No match."));
  rows.slice(0,200).forEach(n=>c.appendChild(noteRow(n)));
  if(rows.length>200) c.appendChild(el("div","tiny","Showing first 200."));
  out.appendChild(c);
}

/* ---------- CSV export ---------- */
const csvCell = v => {
  if(v===null||v===undefined) return "";
  const s=Array.isArray(v)?v.join("; "):String(v);
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
};
const csvRows = r => r.map(x=>x.map(csvCell).join(",")).join("\r\n")+"\r\n";

async function exportCSV(){
  if(!RC.dir){ banner("Choose a folder first."); return; }
  banner("Reading notes\u2026");
  try{
    const ns=await walkNotes(true);
    const wide=[["note_id","date","record_type","contributor","entity","ticker",
      "listed","tickers","subject","tags","attachments","price_target_buy",
      "price_target_sell","conviction","review_date","review_status","priority",
      "last_updated","revision"]];
    for(const n of ns) wide.push([n.note_id,n.date,n.record_type,n.contributor,
      n.entity,n.ticker,n.listed,n.tickers,n.subject,n.tags,n.attachments,
      n.price_target_buy,n.price_target_sell,n.conviction,n.review_date,
      n.review_status,n.priority,n.last_updated,n.revision]);

    // long: one row per note x ticker — the join table for ticker reporting
    const link=[["note_id","date","record_type","contributor","entity","ticker","role","subject","tags"]];
    for(const n of ns){
      if(n.ticker) link.push([n.note_id,n.date,n.record_type,n.contributor,
        n.entity,n.ticker,"primary",n.subject,n.tags]);
      for(const t of (Array.isArray(n.tickers)?n.tickers:[]))
        link.push([n.note_id,n.date,n.record_type,n.contributor,n.entity,t,
                   "associated",n.subject,n.tags]);
    }
    await writeFile(RC.dir,"_export_notes.csv",csvRows(wide));
    await writeFile(RC.dir,"_export_links.csv",csvRows(link));
    banner("Wrote _export_notes.csv ("+(wide.length-1)+" notes) and "
         + "_export_links.csv ("+(link.length-1)+" links).",true);
  }catch(e){ banner("Export failed: "+e.message); }
}

/* ---------- view switching ---------- */
function setView(v){
  VIEW=v;
  $$(".tab").forEach(t=>t.classList.toggle("cur",t.dataset.v===v));
  ["company","theme","review","search"].forEach(x=>
    $("#v_"+x).classList.toggle("hide",x!==v));
}
$$(".tab").forEach(t=>t.onclick=()=>{
  setView(t.dataset.v);
  if(t.dataset.v==="review") renderReview();
  if(t.dataset.v==="search") renderSearch();
});

/* ---------- boot ---------- */
async function boot(){
  await restoreFolder();
  if(!RC.dir){ banner("No folder connected. Click the badge, top right."); return; }
  banner("Loading\u2026");
  await loadConfig();
  const ns=await walkNotes(true);
  const cfg=RC.cfg||SEED;

  // ticker list = every primary ticker plus every associated ticker
  const tset=new Set();
  for(const n of ns){
    if(n.ticker) tset.add(n.ticker);
    for(const t of (Array.isArray(n.tickers)?n.tickers:[])) tset.add(t);
  }
  const dl=$("#alltkr"); dl.innerHTML="";
  [...tset].sort().forEach(t=>{ const o=el("option"); o.value=t; dl.appendChild(o); });
  $("#tkrsummary").textContent = ns.length
    ? tset.size+" tickers across "+ns.length+" records in "+notesLocation()+"."
    : "No notes found in "+notesLocation()+".";

  const th=$("#q_theme"); th.innerHTML=""; th.appendChild(new Option("\u2014",""));
  const inUse=new Set(ns.filter(n=>n.record_type==="Theme").map(n=>n.entity));
  [...new Set([...(cfg.themes||[]),...inUse])].sort()
    .forEach(t=>th.appendChild(new Option(t,t)));

  for(const sel of ["#q_who","#q_revwho"]){
    const s=$(sel);
    (cfg.contributors||[]).forEach(c=>s.appendChild(new Option(c,c)));
  }
  // review queue: themes that actually have Theme records, and every ticker
  const rvth=$("#q_rvtheme");
  [...new Set(ns.filter(n=>n.record_type==="Theme"&&n.entity).map(n=>n.entity))].sort()
    .forEach(t=>rvth.appendChild(new Option(t,t)));
  const rvtk=$("#q_rvtkr");
  [...tset].sort().forEach(t=>rvtk.appendChild(new Option(t,t)));
  const tg=$("#q_tag");
  [...new Set(ns.flatMap(n=>Array.isArray(n.tags)?n.tags:[]))].sort()
    .forEach(t=>tg.appendChild(new Option(t,t)));

  const today=new Date().toISOString().slice(0,10);
  const due=ns.filter(n=>n.review_date&&n.review_date<=today&&n.review_status!=="Done").length;
  $("#duebadge").textContent = due?" ("+due+")":"";

  banner("");
  renderCompany();
}

document.addEventListener("rc-folder",boot);
$("#q_ticker").addEventListener("input",e=>{
  e.target.value=e.target.value.toUpperCase(); renderCompany(); });
$("#q_theme").addEventListener("change",renderTheme);
["#q_revstatus","#q_revwho","#q_rvtype","#q_rvtheme","#q_rvtkr",
 "#q_rvfrom","#q_rvto"].forEach(x=>$(x).addEventListener("change",renderReview));
$("#q_rvnone").addEventListener("change",renderReview);
$("#q_rvclear").onclick=()=>{ $("#q_rvfrom").value=""; $("#q_rvto").value=""; renderReview(); };
$("#q_text").addEventListener("input",renderSearch);
$("#q_tag").addEventListener("change",renderSearch);
$("#q_who").addEventListener("change",renderSearch);
$("#btn_reload").onclick=async()=>{ RC.notes=null; await boot(); };
$("#btn_export").onclick=exportCSV;

boot();
</script>
